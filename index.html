<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>IELTS 听力生词本 · 第1组</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,"PingFang SC",sans-serif;color:#19283b;background:#f7f8fb}*{box-sizing:border-box}body{margin:0}.wrap{max-width:1040px;margin:auto;padding:30px 22px 70px}.eyebrow{font-size:12px;letter-spacing:2px;font-weight:800;color:#66809a}.top{display:flex;justify-content:space-between;gap:16px;align-items:end}.top h1{font-size:clamp(27px,4vw,40px);letter-spacing:-1px;margin:10px 0 8px}.sub{color:#718097;margin:0 0 26px}.stat{background:#e8eff7;padding:10px 15px;border-radius:12px;color:#45617d;font-size:13px;white-space:nowrap}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:27px}.search{flex:1;min-width:180px;border:1px solid #dae2eb;background:white;border-radius:12px;padding:13px 16px;font-size:15px;outline:none}.search:focus{border-color:#7f9ab9}.speed{display:flex;align-items:center;gap:8px;color:#63748a;font-size:13px;background:white;border:1px solid #dae2eb;border-radius:12px;padding:9px 12px}.speed select{border:0;background:transparent;font-size:14px;color:#243c55}.group{margin:28px 0 36px}.groupbar{display:flex;justify-content:space-between;align-items:center;border-radius:13px 13px 0 0;padding:16px 20px;color:white}.groupbar.orange{background:#a55d31}.groupbar.blue{background:#315e88}.groupbar h2{font-size:17px;margin:0}.groupbar span{font-size:12px;opacity:.85}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding:17px;background:#fff;border:1px solid #e7eaf0;border-top:0;border-radius:0 0 16px 16px}.card{background:#fcfdff;border:1px solid #e5eaf1;border-radius:14px;padding:20px;box-shadow:0 2px 7px #182b4106}.head{display:flex;align-items:center;justify-content:space-between;gap:10px}.word{font-size:22px;font-weight:750;letter-spacing:-.5px;overflow-wrap:anywhere}.ipa{color:#68819a;font-size:14px;margin:6px 0 14px}.sound{border:1px solid #c7d8e9;background:#edf5fd;color:#27618c;border-radius:999px;display:flex;align-items:center;gap:6px;cursor:pointer;padding:9px 13px;font-weight:700;font-size:13px;white-space:nowrap;transition:.15s}.sound:hover,.sound.playing{background:#2d648f;color:white;border-color:#2d648f}.sound svg{width:17px;height:17px}.en{font-size:15px;line-height:1.65;color:#1b334d;font-weight:750;min-height:44px}.zh{font-size:12px;color:#9ba7b5;margin-top:11px;font-weight:400;line-height:1.5}.usage{font-size:15px;color:#1f4f73;background:#eff6fc;border:1px solid #dcebf6;border-radius:10px;margin-top:15px;padding:12px 13px;line-height:1.6;font-weight:700}.usage strong{color:#5d809c;font-size:11px;display:block;letter-spacing:.6px;margin-bottom:4px;font-weight:650}.note{font-size:13px;line-height:1.7;color:#75859a;margin-top:16px}.empty{padding:35px;text-align:center;color:#8b97a8}.status{font-size:12px;color:#a55d31;min-height:18px;margin-top:8px}@media(max-width:690px){.wrap{padding:25px 13px 50px}.top{align-items:start}.stat{font-size:12px;padding:9px}.cards{grid-template-columns:1fr;padding:10px;gap:9px}.card{padding:17px}.word{font-size:21px}.groupbar{padding:15px}.en{min-height:0}.sub{font-size:13px}}
</style></head><body><main class="wrap"><div class="eyebrow">IELTS LISTENING / VOCABULARY 01</div><div class="top"><div><h1>听力生词本 <span style="font-weight:400;color:#9bacbd">01</span></h1><p class="sub">英文思维优先 · 常见搭配突出 · 美式发音</p></div><div class="stat">14 个单词与词组</div></div><div class="controls"><input id="search" class="search" placeholder="搜索英文单词、中文意思…" aria-label="搜索单词"><label class="speed">语速 <select id="rate"><option value="0.75">慢速 0.75×</option><option value="0.9">稍慢 0.9×</option><option value="1" selected>正常 1×</option></select></label></div><div id="content"></div><p class="note">🔊 点击小喇叭即可在当前页面播放，无需跳转。使用设备内置英语语音合成，实际音色取决于手机或浏览器；建议在 Safari 或 Chrome 中打开，并确保设备未静音。如果浏览器不支持语音播放，会显示提示。</p><div id="status" class="status" role="status" aria-live="polite"></div></main><script>
const words=[{"word": "stain", "ipa": "/steɪn/", "en": "A mark or patch of colour that is difficult to remove; also, to leave such a mark.", "usage": "remove a stain（去除污渍）", "zh": "污渍；弄脏；着色", "priority": true}, {"word": "registration", "ipa": "/ˌredʒɪˈstreɪʃən/", "en": "The process of officially signing up or recording details.", "usage": "registration form（报名表）", "zh": "登记；注册；报名", "priority": true}, {"word": "leaflet", "ipa": "/ˈliːflət/", "en": "A small printed sheet giving information or advertising something.", "usage": "information leaflet（资料单页）", "zh": "传单；宣传单页", "priority": true}, {"word": "ingredients", "ipa": "/ɪnˈɡriːdiənts/", "en": "The foods or substances used to make a dish or product.", "usage": "list of ingredients（配料表）", "zh": "食材；原料；成分", "priority": true}, {"word": "fill up", "ipa": "/fɪl ʌp/", "en": "To make a container completely full.", "usage": "fill up a bottle（装满瓶子）", "zh": "装满；填满", "priority": true}, {"word": "saw", "ipa": "/sɔː/", "en": "A tool for cutting wood; also the past tense of “see”.", "usage": "use a saw（使用锯子）", "zh": "锯子；锯；see的过去式", "priority": true}, {"word": "shelf", "ipa": "/ʃelf/", "en": "A flat board used to hold or display things.", "usage": "put up a shelf（安装搁板）", "zh": "架子；搁板", "priority": true}, {"word": "enrol", "ipa": "/ɪnˈrəʊl/", "en": "To officially join a course, school, or programme.", "usage": "enrol in a course（报名参加课程）", "zh": "报名；注册入学", "priority": true}, {"word": "dye", "ipa": "/daɪ/", "en": "A substance used to change the colour of something.", "usage": "natural dye（天然染料）", "zh": "染料；染色", "priority": false}, {"word": "external course", "ipa": "/ɪkˈstɜːnəl kɔːs/", "en": "A course offered outside an institution or to people outside it; meaning depends on context.", "usage": "external course registration（校外课程报名）", "zh": "校外／对外课程（依语境）", "priority": false}, {"word": "sourdough", "ipa": "/ˈsaʊədəʊ/", "en": "Bread or dough made using a naturally fermented starter.", "usage": "sourdough bread（酸种面包）", "zh": "酸面团；酸种面包", "priority": false}, {"word": "wrinkles", "ipa": "/ˈrɪŋkəlz/", "en": "Small lines or folds in skin, fabric, or other material.", "usage": "wrinkles in clothes（衣服褶皱）", "zh": "皱纹；褶皱", "priority": false}, {"word": "household repair", "ipa": "/ˈhaʊshəʊld rɪˈpeə/", "en": "Work done to fix things in a home.", "usage": "household repairs（家庭维修工作）", "zh": "家庭维修", "priority": false}, {"word": "electric drill", "ipa": "/ɪˈlektrɪk drɪl/", "en": "A powered tool used to make holes or drive screws.", "usage": "use an electric drill（使用电钻）", "zh": "电钻", "priority": false}];const content=document.getElementById('content'),search=document.getElementById('search'),rate=document.getElementById('rate'),status=document.getElementById('status');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let active=null;
const speaker='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></svg>';
function render(){const q=search.value.trim().toLowerCase();content.innerHTML='';for(const [pri,title,subtitle,theme] of [[true,'优先背诵','MEMORIZE · 8 WORDS','orange'],[false,'重点认识','RECOGNIZE · 6 WORDS','blue']]){const group=words.filter(w=>w.priority===pri&&[w.word,w.en,w.zh,w.usage].some(s=>s.toLowerCase().includes(q)));if(!group.length)continue;const el=document.createElement('section');el.className='group';el.innerHTML='<div class="groupbar '+theme+'"><h2>'+title+'</h2><span>'+subtitle+'</span></div><div class="cards">'+group.map(w=>'<article class="card"><div class="head"><div class="word">'+esc(w.word)+'</div><button class="sound" data-word="'+esc(w.word)+'" title="播放美式发音" aria-label="播放 '+esc(w.word)+' 的发音">'+speaker+'<span>播放</span></button></div><div class="ipa">'+esc(w.ipa)+'</div><div class="en">'+esc(w.en)+'</div><div class="usage">'+esc(w.usage)+'</div><div class="zh">'+esc(w.zh)+'</div></article>').join('')+'</div>';content.appendChild(el)}if(!content.children.length)content.innerHTML='<div class="empty">没有找到匹配的单词</div>'}
function play(word,btn){if(!('speechSynthesis' in window)){status.textContent='当前浏览器不支持直接播放语音，请使用 Safari 或 Chrome 打开。';return}window.speechSynthesis.cancel();if(active)active.classList.remove('playing');active=btn;btn.classList.add('playing');status.textContent='';const u=new SpeechSynthesisUtterance(word);u.lang='en-GB';u.rate=Number(rate.value);u.pitch=1;const voices=window.speechSynthesis.getVoices();const uk=voices.find(v=>v.lang.toLowerCase()==='en-gb'&&/daniel|kate|serena|oliver|google uk english|british/i.test(v.name))||voices.find(v=>v.lang.toLowerCase()==='en-gb');if(uk)u.voice=uk;else status.textContent='设备未提供英式语音，浏览器可能使用默认英语发音。';u.onend=()=>btn.classList.remove('playing');u.onerror=e=>{btn.classList.remove('playing');if(e.error!=='canceled')status.textContent='播放失败，请检查设备音量，或换用 Safari / Chrome。'};window.speechSynthesis.speak(u)}
content.addEventListener('click',e=>{const b=e.target.closest('button[data-word]');if(b)play(b.dataset.word,b)});search.addEventListener('input',render);render();
</script></body></html>
